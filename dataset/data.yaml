# BESTARI - Dataset Configuration for YOLOv8/YOLO11
# Projek Samsung Solve for Tomorrow 2026 - Deteksi Hama Ulat Grayak

path: ./dataset     # Root direktori dataset
train: train/images # Path gambar training
val: valid/images   # Path gambar validasi
test: test/images   # Path gambar testing (opsional)

# Jumlah Kelas & Naming Label
nc: 3
names:
  0: ulat_grayak   # Hama Ulat Grayak (Spodoptera frugiperda)
  1: daun_sehat    # Daun tanaman segar & sehat
  2: daun_rusak    # Daun terkena gigitan/kerusakan akibat ulat
